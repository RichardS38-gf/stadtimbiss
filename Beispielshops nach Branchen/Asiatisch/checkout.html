<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasse · Asia Garden</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D4A017' stroke-width='2' stroke-linecap='round'><line x1='6' y1='3' x2='15' y2='19'/><line x1='11' y1='3' x2='20' y2='19'/></svg>">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .nav { position: sticky; top: 0; z-index: 100; background: #0D0D0D; border-bottom: 1px solid #2A2A2A; }
    .nav__inner { display: flex; align-items: center; justify-content: space-between; min-height: 64px; }
    .nav__logo { font-family: var(--font-head); font-weight: 800; font-size: 1.3rem; color: #D4A017; }
    .nav__back { font-size: var(--text-sm); color: var(--color-muted); }
    .nav__back:hover { color: var(--color-accent); opacity: 1; }
    .icon-gold { width: 1.1em; height: 1.1em; color: var(--color-accent); flex-shrink: 0; vertical-align: -0.15em; }

    .checkout-steps { display: flex; gap: var(--space-3); padding-block: var(--space-5); }
    .step { font-size: var(--text-sm); font-weight: 600; color: var(--color-muted); padding-bottom: 0.5rem; border-bottom: 3px solid transparent; }
    .step--active { color: var(--color-accent); border-bottom-color: var(--color-accent); }

    .checkout-layout { display: grid; grid-template-columns: 1fr; gap: var(--space-6); padding-bottom: var(--space-7); }
    @media (min-width: 1024px) { .checkout-layout { grid-template-columns: 3fr 2fr; align-items: start; } }

    .form-section { border: none; margin-bottom: var(--space-6); }
    .form-section__title { font-family: var(--font-head); font-weight: 800; font-size: var(--text-lg); color: var(--color-ink); margin-bottom: var(--space-4); padding-bottom: var(--space-2); border-bottom: 1px solid var(--color-line); width: 100%; display: block; }
    .form-grid { display: grid; grid-template-columns: 1fr; gap: var(--space-4); }
    @media (min-width: 560px) { .form-grid { grid-template-columns: 1fr 1fr; } }
    .form-field { display: flex; flex-direction: column; gap: var(--space-2); }
    .form-field--full { grid-column: 1 / -1; }
    .form-field label { font-size: var(--text-sm); font-weight: 600; color: var(--color-ink); }
    .form-field input, .form-field textarea { width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #2A2A2A; border-radius: 6px; font-family: var(--font-body); font-size: var(--text-base); color: var(--color-ink); background: #1A1A1A; min-height: 44px; transition: border-color 0.15s; }
    .form-field input:focus, .form-field textarea:focus { outline: none; border-color: var(--color-accent); }
    .form-field textarea { resize: vertical; min-height: 80px; }

    .payment-options { display: flex; flex-direction: column; gap: var(--space-3); }
    .payment-option { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); border: 1.5px solid #2A2A2A; border-radius: 8px; cursor: pointer; background: #1A1A1A; transition: border-color 0.15s; }
    .payment-option:has(input:checked) { border-color: var(--color-accent); }
    .payment-option input { accent-color: var(--color-accent); width: 18px; height: 18px; }
    .payment-option__label { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; color: var(--color-ink); flex: 1; }
    .payment-option--disabled { opacity: 0.5; cursor: not-allowed; }
    .badge--dark { background: var(--color-line); color: var(--color-muted); font-size: var(--text-xs); font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 999px; }

    .checkout-summary { background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 10px; padding: var(--space-5); position: sticky; top: 80px; }
    .checkout-summary__title { font-family: var(--font-head); font-weight: 800; font-size: var(--text-xl); margin-bottom: var(--space-4); }
    .checkout-summary .cart-item { display: flex; align-items: center; gap: var(--space-2); padding-block: var(--space-3); border-bottom: 1px solid var(--color-line); font-size: var(--text-sm); }
    .checkout-summary .cart-item__name { flex: 1; font-weight: 500; }
    .checkout-summary .cart-item__qty { color: var(--color-muted); }
    .checkout-summary .cart-item__price { font-family: var(--font-head); font-weight: 700; }
    .checkout-summary .cart-empty { color: var(--color-muted); font-size: var(--text-sm); padding: var(--space-4) 0; }
    .checkout-summary .cart-summary { margin-top: var(--space-4); }
    .checkout-summary .cart-summary__row { display: flex; justify-content: space-between; font-size: var(--text-sm); padding-block: var(--space-2); }
    .checkout-summary .cart-summary__total { font-family: var(--font-head); font-weight: 800; font-size: var(--text-lg); border-top: 2px solid var(--color-line); padding-top: var(--space-3); margin-top: var(--space-2); }
    .checkout-summary__hint { text-align: center; font-size: var(--text-xs); color: var(--color-muted); margin-top: var(--space-4); }
  </style>
</head>
<body>

  <header class="nav">
    <div class="container nav__inner">
      <a href="index.html" class="nav__logo">
        <svg width="175" height="30" viewBox="0 0 175 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="0" y="24" font-family="serif" font-size="24" font-weight="700" fill="#D4A017">食</text>
          <text x="30" y="24" font-family="'Noto Serif JP', serif" font-size="22" font-weight="900" fill="#D4A017">Asia</text>
          <text x="88" y="24" font-family="'Noto Serif JP', serif" font-size="22" font-weight="700" fill="#F0EAD6">Garden</text>
        </svg>
      </a>
      <a href="bestellen.html" class="nav__back">← Weiter einkaufen</a>
    </div>
  </header>

  <div class="container">
    <div class="checkout-steps">
      <div class="step step--active">1 Adresse</div>
      <div class="step">2 Zahlung</div>
      <div class="step">3 Bestätigung</div>
    </div>
  </div>

  <div class="container checkout-layout">

    <form class="checkout-form" id="checkout-form" novalidate>

      <fieldset class="form-section">
        <legend class="form-section__title">Lieferadresse</legend>
        <div class="form-grid">
          <div class="form-field">
            <label for="vorname">Vorname</label>
            <input type="text" id="vorname" name="vorname" required autocomplete="given-name">
          </div>
          <div class="form-field">
            <label for="nachname">Nachname</label>
            <input type="text" id="nachname" name="nachname" required autocomplete="family-name">
          </div>
          <div class="form-field form-field--full">
            <label for="strasse">Straße + Hausnummer</label>
            <input type="text" id="strasse" name="strasse" required autocomplete="street-address">
          </div>
          <div class="form-field">
            <label for="plz">PLZ</label>
            <input type="text" id="plz" name="plz" required maxlength="5" inputmode="numeric" autocomplete="postal-code">
          </div>
          <div class="form-field">
            <label for="stadt">Stadt</label>
            <input type="text" id="stadt" name="stadt" required autocomplete="address-level2">
          </div>
          <div class="form-field">
            <label for="telefon">Telefon</label>
            <input type="tel" id="telefon" name="telefon" required autocomplete="tel">
          </div>
          <div class="form-field">
            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
        </div>
      </fieldset>

      <fieldset class="form-section">
        <legend class="form-section__title">Anmerkungen</legend>
        <div class="form-field">
          <label for="anmerkungen">Anmerkungen zur Bestellung (optional)</label>
          <textarea id="anmerkungen" name="anmerkungen" rows="3" placeholder="z.B. Klingel defekt, bitte anrufen"></textarea>
        </div>
      </fieldset>

      <fieldset class="form-section">
        <legend class="form-section__title">Zahlungsart</legend>
        <div class="payment-options">
          <label class="payment-option">
            <input type="radio" name="zahlung" value="bar" checked>
            <span class="payment-option__label"><svg class="icon-gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg> Bar bei Lieferung</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="zahlung" value="ec">
            <span class="payment-option__label"><svg class="icon-gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> EC-Karte bei Lieferung</span>
          </label>
          <label class="payment-option payment-option--disabled">
            <input type="radio" name="zahlung" value="paypal" disabled>
            <span class="payment-option__label"><svg class="icon-gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18.01"/></svg> PayPal</span>
            <span class="badge--dark">Bald verfügbar</span>
          </label>
        </div>
      </fieldset>

      <button type="submit" class="btn btn--primary btn--full">Jetzt bestellen →</button>
    </form>

    <aside class="checkout-summary">
      <h3 class="checkout-summary__title">Deine Bestellung</h3>
      <div class="cart-items" id="checkout-items"></div>
      <div class="cart-empty" id="checkout-empty">
        <p>Dein Warenkorb ist leer. <a href="bestellen.html" class="link-accent">Jetzt bestellen →</a></p>
      </div>
      <div class="cart-summary" id="checkout-totals">
        <div class="cart-summary__row">
          <span>Zwischensumme</span>
          <span id="checkout-subtotal">0,00 €</span>
        </div>
        <div class="cart-summary__row">
          <span>Lieferung</span>
          <span>2,50 €</span>
        </div>
        <div class="cart-summary__row cart-summary__total">
          <span>Gesamt</span>
          <span id="checkout-total">0,00 €</span>
        </div>
      </div>
      <p class="checkout-summary__hint">Bezahlung bei Lieferung</p>
    </aside>

  </div>

  <script type="module">
    import { getCart, getCartTotal } from './js/cart.js';

    const cart = getCart();
    const itemsEl = document.getElementById('checkout-items');
    const emptyEl = document.getElementById('checkout-empty');
    const totalsEl = document.getElementById('checkout-totals');
    const subtotalEl = document.getElementById('checkout-subtotal');
    const totalEl = document.getElementById('checkout-total');

    function fmt(n) {
      return n.toFixed(2).replace('.', ',') + ' €';
    }

    if (cart.length === 0) {
      emptyEl.style.display = 'block';
      totalsEl.style.display = 'none';
    } else {
      emptyEl.style.display = 'none';
      totalsEl.style.display = 'block';
      const subtotal = getCartTotal();
      subtotalEl.textContent = fmt(subtotal);
      totalEl.textContent = fmt(subtotal + 2.50);
      itemsEl.innerHTML = cart.map(item => `
        <div class="cart-item">
          <span class="cart-item__name">${item.name}</span>
          <span class="cart-item__qty">×${item.qty}</span>
          <span class="cart-item__price">${fmt(item.price * item.qty)}</span>
        </div>
      `).join('');
    }

    document.getElementById('checkout-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!e.target.checkValidity()) {
        e.target.reportValidity();
        return;
      }
      window.location.href = 'danke.html';
    });

    const nav = document.querySelector('.nav');
    window.addEventListener('scroll', () => {
      if (nav) nav.classList.toggle('scrolled', window.scrollY > 10);
    });
  </script>

</body>
</html>
